name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fahfile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "Menyiapkan environment Android SDK..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Menyetujui lisensi Android SDK agar Gradle dapat mengunduh komponen otomatis.
          # Hash lisensi harus diverifikasi dan tidak boleh dikarang.
          mkdir -p "$ANDROID_HOME/licenses"

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare .env and Debug Keystore
        run: |
          echo "Memeriksa file konfigurasi wajib..."

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "File .env dibuat dari .env.example"
            else
              touch .env
              echo "File .env kosong dibuat"
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore berhasil dibuat dari Base64"
            else
              echo "Membuat debug.keystore dengan keytool..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "debug.keystore berhasil dibuat"
            fi
          fi

      - name: Set up Node.js 20 & Build Web Application
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Prepare Assets
        run: |
          echo "Menginstall dependensi Node.js..."
          npm ci || npm install
          echo "Membangun distribusi web (Vite production build)..."
          npm run build
          echo "Sinkronisasi aset web ke modul Android (Capacitor Sync)..."
          if command -v npx >/dev/null 2>&1; then
            npx cap sync android || echo "Capacitor sync dilewati atau sudah siap."
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Izin eksekusi diberikan pada ./gradlew"
          fi
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "Izin eksekusi diberikan pada ./android/gradlew"
          fi
          if [ ! -f "./gradlew" ] && [ ! -f "./android/gradlew" ]; then
            echo "::error::File gradlew tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "Memulai proses kompilasi APK dengan Gradle Wrapper..."
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              -Pandroid.builder.sdkDownload=true
          else
            cd android
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              -Pandroid.builder.sdkDownload=true
            cd ..
          fi

      - name: Collect APK Files
        run: |
          echo "Mengumpulkan file APK hasil build..."
          mkdir -p build-apks

          find app/build/outputs/apk android/app/build/outputs/apk \
            -name "*.apk" \
            -type f \
            -exec cp -v {} build-apks/ \; 2>/dev/null || true

          APK_COUNT=$(find build-apks -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada file APK yang ditemukan setelah assembleDebug!"
            exit 1
          fi

          echo "Ditemukan $APK_COUNT file APK:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahfile-debug-apk
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "BUILD GAGAL - DETAIL DIAGNOSTIK"
          echo "=============================================="
          echo "Versi Java:"
          java -version || true
          echo "----------------------------------------------"
          echo "Versi Node.js & NPM:"
          node -v || true
          npm -v || true
          echo "----------------------------------------------"
          echo "Versi Gradle:"
          if [ -f "./gradlew" ]; then
            ./gradlew --version || true
          elif [ -f "./android/gradlew" ]; then
            ./android/gradlew --version || true
          fi
          echo "----------------------------------------------"
          echo "Daftar File Direktori:"
          ls -la
          echo "----------------------------------------------"
          echo "Daftar File app/ / android/app/:"
          ls -la app/ 2>/dev/null || ls -la android/app/ || true
          echo "=============================================="
